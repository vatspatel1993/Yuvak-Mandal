<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surendranagar Yuvak Mandal — Data Register</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --primary: #1a5fb4;
      --primary-dark: #0d3d7a;
      --accent: #e8a317;
      --border: #d8dee8;
      --text: #1e2430;
      --muted: #5c6678;
      --danger: #c01c28;
      --success: #1a7f37;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow);
    }

    header h1 { font-size: 1.5rem; font-weight: 700; }
    header p { opacity: 0.9; font-size: 0.95rem; margin-top: 0.25rem; }

    .container { max-width: 1280px; margin: 0 auto; padding: 1.25rem; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .stat-card {
      background: var(--card);
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
      box-shadow: var(--shadow);
      border-top: 3px solid var(--accent);
    }

    .stat-card .num { font-size: 1.75rem; font-weight: 700; color: var(--primary); }
    .stat-card .lbl { font-size: 0.85rem; color: var(--muted); }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--accent);
      color: var(--primary-dark);
    }

    .hint {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 0.85rem;
      background: #f0f4fa;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      border-left: 3px solid var(--primary);
    }

    .section-label {
      grid-column: 1 / -1;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-top: 0.25rem;
      padding-bottom: 0.25rem;
      border-bottom: 1px dashed var(--border);
    }

    .upload-box {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      text-align: center;
      background: #fafbfc;
      margin-bottom: 1rem;
    }

    .upload-box input[type="file"] { margin: 0.5rem 0; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.85rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: var(--muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      background: #fff;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26, 95, 180, 0.15);
    }

    textarea { resize: vertical; min-height: 70px; }
    .full-width { grid-column: 1 / -1; }
    .hidden { display: none !important; }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    button {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.55rem 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.88; }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #e8ecf2; color: var(--text); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-accent { background: var(--accent); color: #1e2430; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: end;
      margin-bottom: 1rem;
    }

    .toolbar .field { flex: 1; min-width: 180px; }

    .import-result {
      margin-top: 0.75rem;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .import-result.ok { display: block; background: #e6f4ea; color: var(--success); }

    .table-wrap {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
      max-width: 100%;
    }

    table {
      width: 100%;
      min-width: 2300px;
